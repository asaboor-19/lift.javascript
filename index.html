<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="lift" id="lift"></div>

        <div class="floors">
            <div class="floor">Floor 4</div>
            <div class="floor">Floor 3</div>
            <div class="floor">Floor 2</div>
            <div class="floor">Floor 1</div>
            <div class="floor">Floor 0</div>
        </div>

    </div>

    <div class="buttons">
        <button onclick="moveLift(4)">4</button>
        <button onclick="moveLift(3)">3</button>
        <button onclick="moveLift(2)">2</button>
        <button onclick="moveLift(1)">1</button>
        <button onclick="moveLift(0)">0</button>
    </div>

    <script src="lift.js"></script>

</body>
</html>
